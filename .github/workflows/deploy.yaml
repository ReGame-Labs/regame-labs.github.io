name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    - run: npm ci

    - run: npm run lint

    - run: npm run build
      env:
        # the chat widget stays hidden until both repository variables exist
        VITE_CHAT_API_URL: ${{ vars.CHAT_API_URL }}
        VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

    - uses: actions/upload-pages-artifact@v5
      with:
        path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v5
